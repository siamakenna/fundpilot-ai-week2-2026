[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundpilot-ai"
version = "0.1.0"
description = "Evidence-backed funding readiness with local Gemma inference"
requires-python = ">=3.11"
dependencies = ["gradio>=5,<7", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
where = ["."]
include = ["fundpilot*"]
